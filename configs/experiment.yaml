# Run parameters and analysis thresholds for the pilot and the main study.
# Decide these BEFORE looking at any result, then lock them:
#   python3 -m sameteacher.core.lock --section pilot_teacher_distance
# Editing a locked section afterwards makes the decision scripts refuse to run.

sampling:
  temperature: 1.0
  top_p: 0.9
  max_tokens: 256
  samples_per_prompt: 30
  concurrency: 8

splits:
  seed: 20261102
  screen: 100
  confirm: 100
  pilot_eval: 100

pilot_teachers:
  teachers: [deepseek, gemma, glm, gpt_oss]
  calibration_teacher: gemma
  min_usable_per_group: 15
  max_exact_duplicate_rate: 0.3
  min_words: 30

pilot_teacher_distance:
  primary_embedder: sentence-transformers/all-mpnet-base-v2
  robustness_embedders: [BAAI/bge-small-en-v1.5, tfidf]
  bootstrap: 2000
  # calibrated_gap = (teacher gap - style control) / (idea control - style control)
  go_low: 0.25
  stop_high: 0.10
  # Reported next to the decision, never used by it. Declared before the confirm split.
  secondary_report:
    - drop prompts where any teacher refuses at least 10% of the time
    - leave one teacher out
    - drop the 10 prompts with the largest gap
    - gemma and gpt_oss rewrite each other's answers, splitting distance into voice and ideas
  human:
    prompts: 40
    go_gap_low: 0.10
    stop_gap_high: 0.03
    min_kappa: 0.40
    idea_control_min_different: 0.60
    style_control_max_different: 0.30

pilot_grid:
  # Chosen on the screen split: deepseek vs glm was the closest pair (calibrated 0.30),
  # which leaves little teacher effect to carry over. deepseek vs gemma: 0.81, both fast.
  teachers: [deepseek, gemma]
  bases:
    X: Qwen/Qwen3-4B-Base
    # Llama-3.1-8B (2024) needs manual license approval. Olmo 3 (2025) is ungated and its
    # pretraining data is public, so what the base already saw can be checked.
    Y: allenai/Olmo-3-1025-7B
  seeds: [0, 1]
  train_examples: 5000
  response_max_tokens: 400
  max_steps: 600
  batch_size: 4
  grad_accum: 4
  learning_rate: 0.0002
  lora_r: 16
  lora_alpha: 32
  max_length: 512
  samples_per_prompt: 30
  gen_batch: 30

pilot_shared_teacher:
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  # carryover = shared-teacher closeness / net teacher sensitivity within a base
  go_low: 0.10
  stop_high: 0.05

pilot_style_norm:
  # Is the shared teacher effect in what students say or in how they say it? One model
  # rewrites every student answer used into the same plain voice, keeping its content, and
  # the shared-teacher quantities are recomputed on the same answers before and after.
  # content_share = shared effect after rewriting / shared effect before.
  rewriter: gpt_oss          # not a pilot teacher, so no student is rewritten in its own teacher's voice
  samples_per_cell: 15       # first usable answers per student and prompt
  min_pairs: 10              # answers per student and prompt whose rewrite is usable
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  ideas_low: 0.5             # IDEAS: the whole content_share interval at or above this
  voice_high: 0.25           # VOICE: the whole interval at or below this; otherwise MIXED_OR_UNCLEAR
  # A rewrite must be closer to its own source than to the other answers of the same
  # student on the same prompt, or the rewriter changed the content. Chance is about 1/14;
  # near-identical answers to one prompt keep a faithful rewriter below 1.
  min_source_match: 0.6

main_grid:
  # The main study (Proposal Section 3). Locked before any main-study result is seen.
  teachers: [deepseek, gemma, glm]
  bases:
    X: Qwen/Qwen3-4B-Base
    Y: allenai/Olmo-3-1025-7B
    Z: HuggingFaceTB/SmolLM3-3B-Base
  seeds: [0, 1, 2]
  # One independent teacher draw per (base, seed), listed in seed order and shared by every
  # teacher. The pilot students keep their draws (X s0 rep0, X s1 rep1, Y s0 rep2,
  # Y s1 rep3) and are reused, so only the other cells get new draws.
  draws:
    X: [0, 1, 4]
    Y: [2, 3, 5]
    Z: [6, 7, 8]
  # Training prompts are the prompts of the pilot training files. A new draw that is not a
  # complete answer is requested again with a new seed, up to this many times.
  draw_retries: 4
  # The next prompts of the shuffled untouched pool, after the three pilot splits.
  test_split: main_test
  test_prompts: 200
  # Training and sampling settings are the pilot's.
  response_max_tokens: 400
  max_steps: 600
  batch_size: 4
  grad_accum: 4
  learning_rate: 0.0002
  lora_r: 16
  lora_alpha: 32
  max_length: 512
  samples_per_prompt: 30
  gen_batch: 30

main_shared_teacher:
  # H1 on the main grid (Proposal, Evaluation). Locked before any main-grid distance is computed.
  # For one prompt, D is the energy distance between two students' answer embeddings, cut to
  # one word budget per prompt across every student and teacher. For bases x != y, teachers
  # a != b and every seed pair, one block is
  #   [D(x<-a, y<-b) + D(x<-b, y<-a)]/2 - [D(x<-a, y<-a) + D(x<-b, y<-b)]/2,
  # the pilot's 2x2 shared effect. S averages the blocks; with this balanced grid it equals the
  # mean cross-base distance between different teachers minus that between the same teacher.
  #   T = distance between students of different teachers on the same base (all seed pairs)
  #   N = distance between seeds of the same base and teacher
  #   carryover = S / (T - N)
  # Per teacher pair, T and N use that pair's teachers; per base pair, they use those bases.
  # Intervals bootstrap prompts. States:
  #   NO_TRANSFER    pooled T - N interval reaches 0
  #   NOT_SUPPORTED  pooled S interval reaches 0
  #   SUPPORTED      pooled S interval above 0, pooled carryover interval at or above
  #                  carryover_floor, and every teacher-pair and base-pair S interval above 0
  #                  at pair_ci_level (Bonferroni over the three pairs of each family)
  #   PARTIAL        pooled S interval above 0 and any other condition fails
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  pair_ci_level: 0.98333
  carryover_floor: 0.10      # the pilot's smallest carryover of interest
  min_usable_per_group: 15   # usable answers per student and per teacher on a prompt
  min_words: 30              # floor of the per-prompt word budget
  # Prediction from the pilot's calibrated teacher distances (0.84, 0.39, 0.20): S is
  # largest for deepseek-gemma and smallest for deepseek-glm. Reported as the observed order
  # and the share of bootstrap draws in this order; descriptive, not part of the state.
  predicted_order: [[deepseek, gemma], [gemma, glm], [deepseek, glm]]
  # Reported, not part of the state: the same quantities with these embedders, and with each
  # seed index left out in turn.
  robustness_embedders: [BAAI/bge-small-en-v1.5, tfidf]
  leave_one_seed_out: true
  # Students with one seed index on one base share their LoRA initialization and, when their
  # files have the same size, their data order. T above uses every seed pair, as in the pilot;
  # also report T and carryover from pairs with different seed indices only.
  distinct_seed_transfer: true

main_style_norm:
  # H2 on the main grid: most of the shared-teacher effect remains after one model rewrites
  # every answer used into the same plain voice (Proposal, Methods and Evaluation). Thresholds
  # are the pilot's. Locked before any main-grid rewrite is analyzed.
  #   R = S rewritten / S as written, on the same answers with one word budget per prompt
  #   SUPPORTED          whole R interval at or above most_low
  #   VOICE              whole R interval at or below voice_high
  #   MIXED_OR_UNCLEAR   otherwise
  #   NO_SHARED_EFFECT   S as written has an interval reaching 0 on these answers
  #   INSTRUMENT_INVALID source match below min_source_match
  rewriter: gpt_oss            # not a main-grid teacher
  samples_per_cell: 15         # first usable answers per student and prompt, by sample index
  min_pairs: 10                # usable rewrites per student and prompt
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  most_low: 0.5
  voice_high: 0.25
  min_source_match: 0.6
  min_words: 30

main_style_norm_second:
  # H2 robustness to the rewriter (Proposal, Methods). A second rewriter from a fifth model
  # family rewrites the same source answers as main_style_norm, on a subset of prompts.
  # Families: teachers DeepSeek, Gemma and GLM, primary rewriter OpenAI (gpt-oss), second
  # rewriter Meta (Llama 4); the bases are Qwen, Olmo and SmolLM3. Locked before any
  # second-rewriter output exists.
  # Subset: the prompts where every student has at least main_style_norm.min_pairs usable
  # primary rewrites, sorted by Infinity-Chat category and then by a hash of subset_seed and the
  # prompt id, keeping every prompt_step-th prompt from the first. All 27 students on every
  # prompt, so the subset is stratified by base, teacher and prompt category.
  # A source answer enters when both of its rewrites are usable answers, and a prompt enters
  # when every student has at least min_pairs such answers. One word budget per prompt across
  # the three stages (written, primary, second).
  #   R_second = S second / S written,  R_primary = S primary / S written, on the same answers
  # The state applies main_style_norm's rule to R_second and to the second rewriter's source
  # match. Reported, not part of the state: R_primary on these answers and R_second - R_primary.
  rewriter: llama4
  prompt_step: 3
  subset_seed: 0
  samples_per_cell: 15
  min_pairs: 10
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  most_low: 0.5
  voice_high: 0.25
  min_source_match: 0.6
  min_words: 30

main_rewrite_check:
  # Stratified hand check of the primary rewriter's content fidelity (Proposal, Evaluation).
  # Items come from the (source, rewrite) pairs that main_style_norm analyzed. per_cell pairs
  # are drawn at random from each base x teacher cell. Decoys pair a source with the rewrite
  # of another answer by the same student to the same prompt, so they should fail. Shared items
  # (shared_per_cell per cell plus shared_decoys) go to every annotator; the rest are split
  # evenly. Sheets show no student, teacher or base, and annotators never open the key.
  # Labels per item, Y or N:
  #   kept   every claim, example and recommendation of the original is in the rewrite
  #   added  the rewrite states a claim or example that is not in the original
  #   plain  the rewrite is plain prose, with no lists, headings or marked voice
  # An item passes when kept = Y and added = N; a shared item takes the majority of each label.
  # Reported: pass rate with a Wilson interval overall, per teacher and per base; plain rate;
  # decoy pass rate; Fleiss' kappa on the shared items for kept and added.
  rewriter: gpt_oss
  per_cell: 15
  shared_per_cell: 3
  decoys: 15
  shared_decoys: 3
  annotators: 3
  seed: 20261105
  ci_level: 0.95

main_teacher_match:
  # Diagnostic, with no state: why gemma's students are not closest to gemma's own test answers
  # (main_shared_teacher, closer_to_own_teacher). Same prompts, word budgets and embedder as
  # main_shared_teacher. Reported with prompt-bootstrap intervals:
  #   energy    3 x 3 mean energy distance from the students of teacher a (rows) to the test
  #             answers of teacher b (columns), pooled over bases and seeds, and per base
  #   centroid  the same matrix for the squared distance between mean embeddings (unbiased
  #             linear-kernel MMD); on unit vectors this still grows with spread, because a
  #             more varied set has a shorter mean vector
  #   direction the same matrix for 1 - cosine between the mean embeddings, from unbiased
  #             inner products, which depends only on where each set's mean points
  #   spread    mean pairwise distance within each teacher's test answers and within the
  #             answers of each student, by teacher
  #   own       for each row, the mean over other teachers minus the own-teacher value, for
  #             each of the three distances (positive: closer to the own teacher)
  # Also reported, from training answers (Dolly) next to test answers and student answers:
  #   style         mean words, formatted share and usable-answer share per teacher
  #   train spread  mean pairwise distance between one teacher's training answers to the same
  #                 Dolly prompt across its draws, on train_prompts prompts drawn with
  #                 train_seed, with one word budget per prompt across the three teachers
  # The H1 embedding matrix is cached for this and for the attribution probe.
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  train_prompts: 300
  train_seed: 0
  min_words: 30

extra_students:
  # Runs beyond the main grid (Proposal, Methods and Baselines), apart from H3. Every trained run
  # uses the main_grid recipe (LoRA, max_steps, batch, learning rate, max_length) and every run
  # samples main_grid.samples_per_prompt answers to each test prompt with the main sampling
  # settings. Locked before any of these runs is trained or sampled.
  data_scaling:
    # Secondary goal: how the shared-teacher effect grows with data. At a fixed max_steps, the
    # student of each base x teacher cell with main-grid seed `seed` trains on the first n
    # examples of one shuffle (subset_seed) of the draw that main-grid student used, with the same
    # LoRA seed. Smaller sets are nested in larger ones, and n = the full draw is the main-grid
    # student itself.
    bases: [X, Y]
    teachers: [deepseek, gemma]
    seed: 0
    sizes: [500, 1000, 2500]
    subset_seed: 0
  human_data:
    # Baseline: Dolly's human response to every main-grid training prompt (the first Dolly row of
    # each prompt, as in the prompt selection). The same file for every run, so the seeds change
    # only the LoRA initialization and data order.
    bases: [X, Y, Z]
    seeds: [0, 1]
  untuned:
    # Baseline: each base without training, prompted in the training format with `shots`
    # (instruction, human response) pairs from main-grid training prompts whose Dolly response has
    # min_words to max_words words, drawn with shot_seed, then the test prompt. Generation stops
    # at the next "###" header.
    bases: [X, Y, Z]
    shots: 3
    shot_seed: 0
    min_words: 20
    max_words: 100

h3_cross_style:
  # H3 data and students (Proposal, Methods): one teacher's training answers rewritten in a
  # second teacher's style. For each base and seed below, the draws of the two teachers that the
  # matching main-grid students used are rewritten twice:
  #   cross  the other teacher rewrites each answer: content of the draw's teacher, style of the
  #          rewriting teacher
  #   self   the draw's own teacher rewrites each answer: the control for rewriting alone
  # The rewriter gets the teachers' system prompt and REWRITE_INSTRUCTION in
  # sameteacher/data/h3_data.py, with the request and the answer, at the main sampling settings
  # and max_tokens below.
  # A rewrite passes when it is a complete answer that did not hit max_tokens and its embedding
  # is closer to its source than to every other answer either teacher gave to that prompt in any
  # of its draws (cosine similarity, full texts). Students train only on the prompts whose
  # rewrites pass in all 16 files, with the main_grid recipe and the LoRA seed of the matching
  # main-grid student, and are sampled like main-grid students. For the hand check,
  # hand_check_per_condition passing rewrites are drawn per condition (deepseek in gemma style,
  # gemma in deepseek style, and the two self-rewrites) with hand_check_seed.
  # Locked before any H3 rewrite is generated.
  teachers: [deepseek, gemma]
  bases: [X, Y]
  seeds: [0, 1]
  max_tokens: 400
  embedder: sentence-transformers/all-mpnet-base-v2
  hand_check_per_condition: 25
  hand_check_seed: 20261106

attribution_probe:
  # Cross-base attribution (Proposal, Evaluation): can a probe trained on two bases name the
  # teacher of a third base's answers to prompts it has not seen? Data: the answers that
  # main_style_norm analyzed (prompts where every student has enough usable rewrites, the first
  # usable answers per student and prompt, cut to that analysis's word budget per prompt), as
  # written and as rewritten by its rewriter. Prompts are split in half with split_seed. For each
  # held-out base and each half, a logistic regression on the embeddings is trained on the other
  # two bases' answers to the other half and tested on the held-out base's answers to this half.
  # Accuracy is pooled over both halves and all held-out bases; chance is 1/3. Intervals
  # bootstrap prompts, with one draw shared by both stages. Reported, with no state: accuracy per
  # held-out base and pooled, recall per teacher, and normalized minus written.
  embedder: sentence-transformers/all-mpnet-base-v2
  C: 1.0
  max_iter: 2000
  split_seed: 0
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

h3_analysis:
  # H3 test (Proposal, Evaluation). Locked before any H3 student is trained. For a cross-style
  # student c (base b, content teacher a, style teacher s, seed k), the reference groups are the
  # main-grid students on base b of teacher a (content group C) and of teacher s (style group S),
  # using only main-grid seeds other than k, so neither group shares c's teacher draw or LoRA seed.
  #   index = [d(c, S) - d(c, C)] / d(S, C)
  # where d is the mean over the students of a group (over student pairs for d(S, C)) of:
  #   normalized  energy distance on embeddings of the answers rewritten as in main_style_norm
  #               (same rewriter, instruction and first usable answers per student and prompt),
  #               averaged over prompts, with one word budget per prompt across every compared
  #               student; H3 students are rewritten into runs/style_norm/h3_students.jsonl
  #   written     the same on those answers as written (reported, not part of the state)
  #   length      absolute difference in mean words per answer, on the written answers
  #   formatting  absolute difference in the share of formatted answers (markdown, list markers
  #               or line breaks), on the written answers
  # +1 means c sits with its content teacher's students, -1 with its style teacher's students.
  # Prompts: those where every compared student has main_style_norm.min_pairs usable rewrites.
  # Pooled = mean over the 8 cross-style students; also per direction and per base. Self-rewrite
  # students (s = a) get the same index with S = the other teacher's students, as the control for
  # rewriting alone (reported, not part of the state).
  # Intervals bootstrap prompts, with one draw for every quantity. States:
  #   SUPPORTED      pooled normalized index interval above 0, and pooled length and formatting
  #                  index intervals both below 0
  #   PARTIAL        exactly one of the two holds (content follows the content teacher, or style
  #                  follows the style teacher)
  #   NOT_SUPPORTED  neither holds
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

extra_analysis:
  # Analyses of the extra_students runs (Proposal, Methods: data scaling; Baselines: human-data
  # students and untuned bases). Locked before any of their answers is read. No decision rule:
  # every quantity is reported with a prompt-bootstrap interval. Answers are taken and rewritten
  # as in main_style_norm (same rewriter, instruction, samples_per_cell, min_pairs and min_words;
  # extra students into runs/style_norm/extra_students.jsonl, main-grid students reuse their H2
  # rewrites). Each family has its own prompts (every compared student has min_pairs usable
  # rewrites) and one word budget per prompt across both stages and every compared student.
  # d is the energy distance on embeddings of one prompt's answers, averaged over prompts; every
  # quantity is given as written and rewritten, with R = rewritten / written for each S.
  #
  # scaling: the 12 data-scaling students (bases X, Y; teachers a = deepseek, b = gemma; seed 0;
  #   n = 500, 1000, 2500) and the main-grid students of those four cells (all seeds). The
  #   main-grid seed-0 students are n = 4938.
  #     S(n) = [d(Xa, Yb) + d(Xb, Ya)]/2 - [d(Xa, Ya) + d(Xb, Yb)]/2
  #     T(n) = [d(Xa, Xb) + d(Ya, Yb)]/2
  #     N    = main-grid seed noise of the four cells (mean over cells and seed pairs), one value
  #            for every n, since each size has one seed
  #     carryover(n) = S(n) / (T(n) - N), and S(n) / T(n), which needs no N
  #   Reported: these per n, S(n) - S(4938) and carryover(n) - carryover(4938). Prediction
  #   (descriptive): S grows with n, reported as the share of draws with
  #   S(500) < S(1000) < S(2500) < S(4938).
  # human: the six human-data students as a fourth source h beside the three teachers, with the
  #   27 main-grid students. For sources p, q:
  #     cross(p, q)   mean over ordered base pairs x != y and seed combinations of d(x<-p, y<-q)
  #     within(p, q)  mean over bases and seed combinations of d(x<-p, x<-q), p != q
  #     N(p)          mean over bases and seed pairs of d(x<-p seed i, x<-p seed j)
  #     G(p) = cross(p, p) - N(p)   the base gap left when both bases learn from p
  #     S(p, q) = cross(p, q) - [cross(p, p) + cross(q, q)]/2
  #     carryover(p, q) = S(p, q) / (within(p, q) - [N(p) + N(q)]/2)
  #   Reported: G(h), G(t) per teacher and their mean over teachers, G(h) minus that mean;
  #   S(h, t) and carryover(h, t) per teacher and pooled (ratio of means over teachers), against
  #   the teacher pairs pooled on the same prompts. The human students share one fixed file,
  #   while main-grid students on different bases learned from different draws of a teacher.
  # untuned: the three untuned bases u (one run each) with the 27 main-grid students.
  #     U = mean over base pairs of d(x<-u, y<-u); no N, since untuned runs have no training seed
  #   Reported: U; cross(t, t) averaged over teachers (same teacher) and cross(p, q) averaged over
  #   teacher pairs (different teachers); N averaged over teachers; G same = same - N and
  #   G different = different - N; U - G same and U - G different; per base pair, U and G same
  #   (N from the pair's two bases); per base, the tuning shift, mean over teachers and seeds of
  #   d(x<-u, x<-t).
  # Also reported for every family: the source match of the rewrites (as in main_style_norm) and
  # the mean words and formatted share of each student group, written and rewritten.
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

h3_rewrite_check:
  # Hand check of the H3 training rewrites. h3_cross_style.hand_check_per_condition rewrites are
  # drawn per condition (deepseek in gemma style, gemma in deepseek style, deepseek in deepseek
  # style, gemma in gemma style) with h3_cross_style.hand_check_seed, from the H3 training files,
  # so every item passed the source-match test and was trained on. Decoys pair a source with the
  # rewrite, by the same rewriter, of another draw's answer to the same prompt (another file of
  # the same condition), so they should fail. Shared items (shared_per_condition per condition
  # plus shared_decoys) go to every annotator; the rest are dealt out in turn. Sheets show the
  # request, the source and the rewrite, with no condition, base or teacher.
  # Labels per item, Y or N:
  #   kept   every idea, claim, example and recommendation of the source is in the rewrite
  #   added  the rewrite states an idea, claim or example that is not in the source
  # A change of voice, length or formatting is expected and is not judged. An item passes when
  # kept = Y and added = N; a shared item takes the majority of each label. Reported: pass rate
  # with a Wilson interval per condition, cross and self pooled, and overall; decoy pass rate;
  # Fleiss' kappa on the shared items for kept and added.
  shared_per_condition: 3
  decoys: 12
  shared_decoys: 3
  annotators: 3
  seed: 20261107
  ci_level: 0.95

h3_training_data:
  # H3 training data (Proposal, Methods). Replaces the source-match filter of h3_cross_style as
  # the rule for which rewrites the H3 students train on; every other part of h3_cross_style is
  # unchanged. Locked after the H3 rewrites and the source-match test were run and before any H3
  # student is trained or sampled.
  # Why: the locked test keeps 111 of 4,938 prompts in all 16 files. Its rivals include the
  # content teacher's other draws, which are often near-duplicates of the source, and it runs on
  # full-text embeddings that also carry style, so it fails many faithful rewrites and fails
  # cross rewrites more often than self rewrites (runs/results/main/h3/source_match.json and
  # source_match_diagnostic.json).
  # Rule: a rewrite is kept when it did not hit h3_cross_style.max_tokens and is a usable answer
  # (sameteacher.core.text.is_answer). Students train on the prompts whose rewrites are kept in
  # all 16 files, with the main_grid recipe and the LoRA seed of the matching main-grid student,
  # and are sampled like main-grid students.
  # The source-match test is still reported for every file, with no rule attached. Content
  # fidelity is checked by the hand check (h3_rewrite_check), whose items are drawn from these
  # training files; its key also records whether each real item passes the locked source-match
  # test, and its score adds the pass rate of real items split by that outcome. The self-rewrite
  # students remain the control for rewriting alone.
  keep: complete_in_every_file

main_human_eval:
  # Human evaluation of H1 (Proposal, Evaluation). Locked before any pair is drawn. A pair is two
  # answers to one test prompt from two main-grid students on different bases, one answer each.
  # same pairs have one teacher; different pairs have two teachers. Prompts are the H1 prompts
  # (main_shared_teacher), one prompt per pair, drawn without replacement with seed. Cells: base
  # pair x teacher for same pairs, base pair x teacher pair for different pairs (9 each). Each
  # kind cycles through its 9 cells in a seeded order until it has pairs_per_kind pairs (8 or 9
  # per cell). In a pair, each student's seed is drawn from main_grid.seeds, the teachers of a
  # different pair are assigned to the two bases at random, each answer is drawn from the
  # student's usable answers to the prompt (is_answer), and the order of A and B is random.
  # Answers are shown in full, as written. Every annotator labels every pair, each in an order of
  # their own; sheets show the prompt and the two answers, with no base, teacher or seed.
  # Label per pair, Y or N:
  #   same_idea  the two answers give the same main idea: the same central claim or
  #              recommendation, reading of the request, or example or approach they build on.
  #              Wording, length, tone, formatting and small details are not judged.
  # A pair's label is the majority of the annotators. Reported, with no state: the same-idea rate
  # with a Wilson interval for same and for different pairs; same minus different with a
  # bootstrap interval over pairs (prediction from H1: above 0); both rates per base pair, per
  # teacher for same pairs and per teacher pair for different pairs; each annotator's rates;
  # Fleiss' kappa over all pairs; and, as a check of the embedding, the mean cosine similarity of
  # the two answers (embedder below) for pairs labeled Y and N and its AUC for the label.
  pairs_per_kind: 75
  annotators: 3
  seed: 20261108
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

main_robustness:
  # Robustness to the embedder (Proposal, Evaluation: the distance metrics repeated with
  # bge-small and TF-IDF). H1 is repeated in main_shared_teacher (robustness_embedders). This
  # section repeats the other energy-distance analyses with the same embedders. Each analysis
  # keeps its locked section's answers, prompts, word budgets, bootstrap draws and quantities,
  # and only the embedder changes:
  #   h2       main_style_norm: S and carryover as written and rewritten, and R
  #   h3       h3_analysis: the written and normalized indices (length and formatting use no
  #            embedder and come out unchanged)
  #   scaling, human, untuned   extra_analysis
  # TF-IDF is fit on each analysis's own texts, both stages together, as in main_shared_teacher.
  # Source match is an mpnet check of the rewriter and is not repeated. Reported, with no state:
  # the rule of each locked section is applied to these embedders as a reading only. Locked
  # before any of these analyses runs on these embedders.
  embedders: [BAAI/bge-small-en-v1.5, tfidf]
  analyses: [h2, h3, scaling, human, untuned]

main_qualitative:
  # Per-category breakdown and qualitative examples (Proposal, Evaluation: describe what students
  # inherit on the prompts with the largest shared effect). Locked before any per-category value
  # or example is computed.
  # Category: the Infinity-Chat category of each test prompt. Categories with at least
  # min_prompts H1 prompts are reported on their own; the others are pooled as "other". Per
  # category:
  #   S                     mean of the per-prompt H1 S (main_shared_teacher, mpnet, as stored
  #                         in h1.json) over the category's H1 prompts
  #   S written, S rewritten, R   the same on main_style_norm's answers and prompts (mpnet, its
  #                         word budgets); R = mean S rewritten / mean S written
  # Intervals bootstrap prompts within the category (bootstrap draws from bootstrap_seed).
  # Examples: the top_k H1 prompts by per-prompt S. For each, the full written usable answers of
  # the three teachers and of the 27 main-grid students are embedded with the embedder below.
  # Groups: each teacher, and each base's students of one teacher (seeds pooled). Reported per
  # group: the examples_per_group answers with the highest mean cosine similarity to the rest of
  # the group (its most central answers), and the share of the group's answers whose nearest
  # teacher centroid belongs to each teacher. We write the descriptions of what students inherit
  # from these answers. Reported, with no state.
  min_prompts: 8
  top_k: 10
  examples_per_group: 2
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

stretch_students:
  # Stretch goals (Proposal, Methods). Locked before any of these runs is trained or sampled.
  # persistence: does the shared-teacher effect survive a second SFT stage on human-written answers?
  #   Each main-grid student below continues training its own LoRA adapter (same rank and alpha,
  #   new AdamW optimizer and schedule) on the extra_students human file (Dolly's human response
  #   to every main-grid training prompt) with the main_grid recipe (max_steps, batch, learning
  #   rate, max_length) and its main-grid LoRA seed, so the second stage is as long as the first.
  #   Sampled like main-grid students (main_grid samples_per_prompt, gen_batch, prompt format and
  #   the main sampling settings) on the main test prompts. Students are named
  #   <base>__<teacher>__s<seed>__then_human, stage `persist`.
  persistence:
    bases: [X, Y]
    teachers: [deepseek, gemma]
    seeds: [0, 1]
  # released: released models distilled from one teacher onto two base families, against
  #   released models of the same two base families tuned by other developers. The two families
  #   are rows (qwen, llama) and the tuning source is the column (r1 for DeepSeek-R1, other).
  #   Each model gets its own chat template with no added system prompt (the template's default,
  #   if any, stays), and the test prompt as the user turn. All four are sampled with the same
  #   settings below (DeepSeek's recommended temperature and top_p for the R1 distills, used for
  #   every model so sampling is not part of the comparison). For models that reason, the answer
  #   is the text after the last </think>; a sample whose reasoning does not close within
  #   max_new_tokens has no answer. Answers are cut to their first answer_words words, so the
  #   rewriter's token limit is not reached. Prompts: the first `prompts` prompts of the main test
  #   split (the split is a random draw from the pool), written to runs/prompts/stretch_released.jsonl.
  #   Stage `released`, students named released__<family>__<source>.
  released:
    models:
      qwen:
        r1: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B     # base Qwen2.5-Math-7B
        other: Qwen/Qwen2.5-7B-Instruct                 # base Qwen2.5-7B, Qwen's own post-training
      llama:
        r1: deepseek-ai/DeepSeek-R1-Distill-Llama-8B    # base Llama-3.1-8B
        other: allenai/Llama-3.1-Tulu-3-8B              # base Llama-3.1-8B, Ai2's Tulu 3 post-training
    reasoning: [r1]
    prompts: 100
    samples_per_prompt: 20
    gen_batch: 20
    temperature: 0.6
    top_p: 0.95
    max_new_tokens: 2048
    answer_words: 150

stretch_analysis:
  # Analyses of the stretch_students runs. Locked before any of their answers is read. Answers
  # are taken and rewritten as in extra_analysis (main_style_norm rewriter, instruction,
  # samples_per_cell, min_pairs and min_words; stretch students into
  # runs/style_norm/stretch_students.jsonl, main-grid and human-data students reuse their
  # rewrites). Each family has its own prompts and one word budget per prompt across both stages
  # and every compared student; d is the energy distance on embeddings, averaged over prompts;
  # every quantity is given as written and rewritten, with R = rewritten / written for each S.
  #
  # persistence: bases X, Y; teachers a = deepseek, b = gemma; seeds 0, 1. Three groups: the
  #   main-grid students (before), their second-stage students (after), and the human-data
  #   students of extra_students on X and Y (human). For a group F with students x<-t seed i:
  #     cross_F(p, q) = mean over seeds i, j of [d(X<-p i, Y<-q j) + d(Y<-p i, X<-q j)]/2
  #     S_F = [cross_F(a, b) + cross_F(b, a)]/2 - [cross_F(a, a) + cross_F(b, b)]/2
  #     T_F = mean over bases and seeds i, j of d(x<-a i, x<-b j)
  #     N_F = mean over bases and teachers of d(x<-t 0, x<-t 1)
  #     carryover_F = S_F / (T_F - N_F);  G_F = [cross_F(a, a) + cross_F(b, b)]/2 - N_F
  #     G human = mean over seeds i, j of d(X<-h i, Y<-h j) - N human
  #     H_F = mean over bases, teachers and seeds i, j of d(x<-t i, x<-h j), the distance to the
  #           human-data students on the same base
  #   Reported: these for before and after; P = S_after / S_before; S_after - S_before;
  #   carryover_after - carryover_before; T_after / T_before; G_after - G_before;
  #   G_after - G human; H_after / H_before.
  #   Reading (written stage; the same reading is also reported for the rewritten stage):
  #     NO_EFFECT_BEFORE  if the S_before interval reaches 0
  #     ERASED            else if the S_after interval reaches 0
  #     SURVIVES          else if the lower end of the P interval is at least survive_at
  #     MOSTLY_ERASED     else if the upper end of the P interval is at most erased_at
  #     PARTLY_SURVIVES   otherwise
  # released: the four models of stretch_students.released, rows qwen, llama, columns r1, other.
  #     S = [d(qwen r1, llama other) + d(qwen other, llama r1)]/2
  #         - [d(qwen r1, llama r1) + d(qwen other, llama other)]/2
  #     shared minus other = d(qwen other, llama other) - d(qwen r1, llama r1)
  #     T = [d(qwen r1, qwen other) + d(llama r1, llama other)]/2, and S / T (no N: one run each)
  #   S is the main-grid S with "other" as a second source. It does not depend on how far each
  #   model is from all the others, and it would also be positive if the two "other" models shared
  #   a source, so shared minus other is reported beside it. Reading: SUPPORTED if the written S
  #   interval is above 0, NOT_SUPPORTED otherwise; when SUPPORTED, R is read with the
  #   main_style_norm thresholds (CONTENT if the lower end of the R interval is at least most_low,
  #   VOICE if the upper end is at most voice_high, MIXED otherwise).
  #   Also reported for every family: the source match of the rewrites (as in main_style_norm),
  #   the mean words and formatted share of each group, written and rewritten, and for the
  #   released models the share of samples with an answer and the mean words of reasoning.
  survive_at: 0.5
  erased_at: 0.25
  embedder: sentence-transformers/all-mpnet-base-v2
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95

main_human_eval_followup:
  # Follow-up to main_human_eval. Designed after its result was seen (same minus different
  # -0.093 [-0.253, +0.067]) and locked before any number below is computed, so it is reported
  # as a follow-up check. It asks whether the embedders see a same-teacher advantage on the 150
  # labeled pairs, and how large a difference in the human label the grid-wide embedding
  # advantage implies for one answer pair.
  #   pairs  For each embedder, the cosine of the two answers of each labeled pair (the full
  #          answers shown to the annotators, cleaned as in main_human_eval; TF-IDF fit on these
  #          300 answers). Mean for same and for different pairs, and same minus different, with a
  #          bootstrap over pairs that resamples each kind on its own, as main_human_eval does.
  #   link   Logistic regression of the majority label (Y = 1) on the link_embedder cosine over
  #          the 150 pairs (maximum likelihood, no penalty). Implied difference on the labeled
  #          pairs: mean fitted P(Y) over same pairs minus over different pairs.
  #   grid   On the H1 prompts, every pair of usable answers (is_answer; full, cleaned) from two
  #          main-grid students on different bases. Per prompt, the 9 same cells (base pair x
  #          teacher) and the 9 different cells (base pair x teacher pair, both assignments of
  #          the two teachers to the two bases, half weight each); each cell averages its 9 seed
  #          pairs equally and, within a seed pair, every answer pair equally; cells within a
  #          kind and prompts weigh equally. This is the distribution the labeled pairs were drawn
  #          from. Reported: mean link_embedder cosine for same and different, same minus
  #          different; the implied human-label difference, mean fitted P(Y) over same pairs minus
  #          over different pairs, with cosines binned at bin_width; and the pairs per kind that a
  #          two-sided test at alpha needs for the given power to detect the implied difference
  #          (normal approximation at the observed overall same-idea rate).
  # Intervals: one bootstrap; each draw resamples the labeled pairs within kind (pairs and link,
  # refitting the regression) and the H1 prompts (grid). Reported with no state.
  embedders: [sentence-transformers/all-mpnet-base-v2, BAAI/bge-small-en-v1.5, tfidf]
  link_embedder: sentence-transformers/all-mpnet-base-v2
  bin_width: 0.005
  power: 0.8
  alpha: 0.05
  bootstrap: 2000
  bootstrap_seed: 0
  ci_level: 0.95
